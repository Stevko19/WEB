<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ANTHROPIA</title>
  <meta name="description" content="Anthropia — výber antropologických textov s kritikou a úlohami pre študentov magisterského stupňa.">

  <!-- Písma: Bodoni Moda (značka a nadpisy), Literata (čítanie) a Schibsted Grotesk (rozhranie) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..900&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Schibsted+Grotesk:wght@400..900&display=swap">

  <!-- Tailwind: predkompilované utility (funguje aj offline).
       Pri úpravách šablóny môžete namiesto neho dočasne použiť Play CDN:
       <script src="https://cdn.tailwindcss.com/3.4.17"></script>
       <script src="tailwind.config.js"></script>
       a potom CSS znova zostaviť (pozri CITAJMA.md). -->
  <link rel="stylesheet" href="tailwind.css">
  <!-- Vlastné štýly: tokeny, oblúkový karusel, režim čítania -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="font-ui antialiased">

  <h1 class="sr-only" data-bind="nazov">ANTHROPIA</h1>
  <div id="safe-probe" aria-hidden="true"></div>

  <!-- =====================================================================
       POHĽAD 1 — GALÉRIA (oblúkový karusel)
       Karty generuje app.js z poľa window.CLANKY.
       ===================================================================== -->
  <div id="gallery" class="gallery">
    <div class="gallery-ambient" aria-hidden="true"></div>

    <header id="gallery-header" class="gallery-header flex items-center justify-between gap-4">
      <a href="#" class="brand rounded-full text-bone" data-action="home" aria-label="Anthropia — domov">
        <span class="brand-word" aria-hidden="true">ANTHR<span class="brand-o">O</span>PIA</span>
      </a>
      <button id="open-index" type="button"
              class="flex shrink-0 items-center gap-2 rounded-full border border-line-strong px-4 py-2 text-[0.85rem] font-semibold text-bone transition-colors hover:bg-raised max-[480px]:h-11 max-[480px]:w-11 max-[480px]:justify-center max-[480px]:p-0">
        <svg class="h-4 w-4 shrink-0 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        <span class="max-[480px]:sr-only" data-bind="zoznam">Zoznam článkov</span>
      </button>
    </header>

    <div id="arc" class="arc" role="group" aria-roledescription="karusel" aria-label="Výber článkov" aria-describedby="arc-help"></div>
    <p id="arc-help" class="sr-only">Karusel otáčate šípkami doľava a doprava, potiahnutím alebo kolieskom myši. Článok v strede otvoríte klávesom Enter.</p>

    <section id="focus" class="focus" aria-label="Vybraný článok">
      <h2 id="focus-title" class="focus-title font-read text-bone"></h2>
      <p id="focus-perex" class="focus-perex line-clamp-3 text-ash"></p>
      <div class="flex items-center gap-3">
        <button id="focus-open" type="button"
                class="rounded-full bg-bone px-5 py-3 text-[0.9rem] font-semibold leading-none text-ink transition-colors hover:bg-white">
          <span data-bind="citat">Čítať článok</span>
        </button>
        <span id="focus-draft" class="rounded-full border border-dashed border-line-strong px-4 py-2 text-[0.85rem] font-medium text-ash" hidden>
          <span data-bind="pripravujeme">Pripravuje sa</span>
        </span>
      </div>
      <p id="focus-count" class="text-[0.8rem] tabular-nums text-ash"></p>
    </section>
    <p id="focus-live" class="sr-only" aria-live="polite" aria-atomic="true"></p>

    <button id="arc-prev" type="button" class="arc-nav arc-nav--prev" aria-label="Predchádzajúci článok">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button id="arc-next" type="button" class="arc-nav arc-nav--next" aria-label="Ďalší článok">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <!-- =====================================================================
       ZOZNAM ČLÁNKOV (prístupná alternatíva ku karuselu)
       ===================================================================== -->
  <div id="index" class="index" role="dialog" aria-modal="true" aria-labelledby="index-title" hidden>
    <div class="mx-auto flex max-w-[44rem] flex-col gap-5">
      <div class="flex items-center justify-between gap-4">
        <h2 id="index-title" class="font-read text-[1.75rem] font-semibold tracking-[-0.01em] text-bone" data-bind="zoznam">Zoznam článkov</h2>
        <button type="button" class="icon-btn" data-action="index-close" aria-label="Zavrieť zoznam">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <label for="index-search" class="sr-only">Hľadať v článkoch</label>
      <input id="index-search" type="search" autocomplete="off" placeholder="Hľadať podľa názvu alebo perexu"
             class="index-search w-full rounded-full border border-line bg-raised px-5 py-3 text-[0.95rem] text-bone">
      <ul id="index-list" class="flex flex-col"></ul>
      <p id="index-empty" class="py-6 text-center text-ash" hidden>Nič sa nenašlo. Skúste iné slovo.</p>
    </div>
  </div>

  <!-- =====================================================================
       POHĽAD 2 — DETAIL ČLÁNKU (celá obrazovka)
       Obsah vykresľuje app.js podľa ID z adresy (#id-clanku).
       ===================================================================== -->
  <div id="reader" class="reader" hidden></div>

  <noscript>
    <p style="position:fixed;inset:auto 1rem 1rem;padding:1rem;background:#1b2024;color:#eeebe3;border-radius:.75rem;font:15px/1.5 system-ui">
      Galéria článkov potrebuje zapnutý JavaScript.
    </p>
  </noscript>

  <!-- Markdown a čistenie HTML (voliteľné: bez nich šablóna použije vstavanú náhradu) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <!-- Dáta a aplikácia -->
  <script src="clanky.js"></script>
  <script src="app.js"></script>
</body>
</html>
